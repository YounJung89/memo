<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로열 메모리</title>
<style>
  :root {
    --bg1: #fdf2f8;
    --bg2: #f3e8ff;
    --ink: #4a3b5c;
    --muted: #8f7fa5;
    --accent: #c084fc;
    --card-size: min(20vw, 110px);
    --gap: min(3vw, 14px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background-color: var(--bg2);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g font-size='20' text-anchor='middle' opacity='0.5'><text x='30' y='38'>👑</text><text x='90' y='98'>✨</text><text x='90' y='38' font-size='14'>💖</text><text x='30' y='98' font-size='14'>⭐</text></g></svg>"),
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.7), transparent 45%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    background-size: 120px 120px, auto, auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 12px;
  }
  h1 { font-size: 24px; margin-bottom: 16px; }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 24px;
  }
  .stat {
    background: #fff; border-radius: 999px; padding: 8px 18px;
    box-shadow: 0 4px 14px rgba(160,110,200,.14);
    font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .stat b { margin-left: 6px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; color: #fff;
    background: var(--accent); border: 0; border-radius: 999px;
    padding: 9px 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(192,132,252,.4);
    transition: transform .15s, filter .15s;
  }
  button:hover { filter: brightness(1.05); transform: translateY(-1px); }

  .board {
    display: grid;
    grid-template-columns: repeat(4, var(--card-size));
    grid-auto-rows: var(--card-size);
    gap: var(--gap);
  }
  .card {
    perspective: 600px; cursor: pointer; border: 0; background: none; padding: 0;
    box-shadow: none; border-radius: 0;
  }
  .card:hover { transform: none; filter: none; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .35s;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 20px; box-shadow: 0 6px 16px rgba(160,110,200,.2);
  }
  .back {
    background: linear-gradient(135deg, #f3e0ff, #ffe0ee);
    font-size: calc(var(--card-size) * .3); color: rgba(255,255,255,.95);
  }
  .front {
    background: #fff; transform: rotateY(180deg);
    font-size: calc(var(--card-size) * .5);
  }
  .card.matched { cursor: default; pointer-events: none; }
  .card.matched .front { opacity: .45; }

  .overlay {
    position: fixed; inset: 0; background: rgba(70,40,100,.3);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 28px; padding: 36px 40px; text-align: center;
    box-shadow: 0 20px 50px rgba(70,40,100,.3);
  }
  .modal .big { font-size: 48px; margin-bottom: 8px; }
  .modal h2 { font-size: 24px; margin-bottom: 12px; }
  .modal p { color: var(--muted); margin-bottom: 24px; line-height: 1.8; }
  .modal p b { color: var(--ink); }
</style>
</head>
<body>
  <h1>👸 로열 메모리 🤴</h1>
  <div class="bar">
    <div class="stat">⏱ <b id="time">00:00</b></div>
    <div class="stat">점수 <b id="score">0</b></div>
    <div class="stat">시도 <b id="tries">0</b></div>
    <button id="restart">다시 시작</button>
    <button id="mute" aria-label="효과음 켜기/끄기">🔊</button>
  </div>
  <div class="board" id="board"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="big">🎉</div>
      <h2>완료!</h2>
      <p>시간 <b id="rTime"></b><br>점수 <b id="rScore"></b><br>시도 횟수 <b id="rTries"></b>회</p>
      <button id="again">다시 하기</button>
    </div>
  </div>

<script>
  const EMOJIS = ["👸","🤴","👑","🏰","🐴","🧚","🦄","🐉"];
  const board = document.getElementById("board");
  const timeEl = document.getElementById("time");
  const triesEl = document.getElementById("tries");
  const scoreEl = document.getElementById("score");
  const overlay = document.getElementById("overlay");

  let first = null, lock = false, tries = 0, score = 0;
  let timer = null, startAt = 0;

  // ---- 효과음 (Web Audio, 외부 파일 없음) ----
  let actx = null, muted = false;
  function tone(freq, start, dur, type = "sine", vol = 0.15) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + start;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  const sfx = {
    flip:  () => tone(660, 0, 0.08, "triangle", 0.12),
    match: () => { tone(784, 0, 0.15); tone(1047, 0.1, 0.25); },
    miss:  () => { tone(220, 0, 0.18, "sawtooth", 0.07); tone(165, 0.12, 0.22, "sawtooth", 0.07); },
    win:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.12, 0.35, "triangle", 0.16))
  };

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function startTimer() {
    startAt = Date.now();
    timer = setInterval(() => { timeEl.textContent = fmt(Date.now() - startAt); }, 250);
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function reset() {
    clearInterval(timer);
    timer = null; first = null; lock = false; tries = 0; score = 0;
    timeEl.textContent = "00:00"; triesEl.textContent = "0"; scoreEl.textContent = "0";
    overlay.classList.remove("show");
    board.innerHTML = "";
    shuffle([...EMOJIS, ...EMOJIS]).forEach(e => {
      const c = document.createElement("button");
      c.className = "card";
      c.dataset.emoji = e;
      c.setAttribute("aria-label", "카드");
      c.innerHTML = '<div class="inner"><div class="face back">✦</div><div class="face front">' + e + '</div></div>';
      c.addEventListener("click", () => flip(c));
      board.appendChild(c);
    });
  }

  function flip(c) {
    if (lock || c === first || c.classList.contains("matched") || c.classList.contains("flipped")) return;
    if (!timer) startTimer();
    c.classList.add("flipped");
    sfx.flip();
    if (!first) { first = c; return; }

    tries++; triesEl.textContent = tries;
    const a = first, b = c;
    first = null;
    if (a.dataset.emoji === b.dataset.emoji) {
      a.classList.replace("flipped", "matched");
      b.classList.replace("flipped", "matched");
      score++; scoreEl.textContent = score;
      if (score === EMOJIS.length) finish(); else setTimeout(sfx.match, 250);
    } else {
      lock = true;
      setTimeout(sfx.miss, 300);
      setTimeout(() => {
        a.classList.remove("flipped"); b.classList.remove("flipped");
        lock = false;
      }, 800);
    }
  }

  function finish() {
    clearInterval(timer);
    const t = fmt(Date.now() - startAt);
    timeEl.textContent = t;
    document.getElementById("rTime").textContent = t;
    document.getElementById("rScore").textContent = score + " / " + EMOJIS.length;
    document.getElementById("rTries").textContent = tries;
    setTimeout(() => { overlay.classList.add("show"); sfx.win(); }, 500);
  }

  document.getElementById("mute").addEventListener("click", e => {
    muted = !muted;
    e.currentTarget.textContent = muted ? "🔇" : "🔊";
  });

  document.getElementById("restart").addEventListener("click", reset);
  document.getElementById("again").addEventListener("click", reset);
  reset();
</script>
</body>
</html>
