<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 — 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colors (Figma variables) */
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;
    /* Spacing & radius */
    --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px;
    --space-20: 20px; --space-24: 24px; --space-34: 34px; --space-64: 64px;
    --radius-sm: 12px; --radius-md: 16px; --radius-xl: 24px; --radius-full: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--surface-page); }
  body {
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, a { font: inherit; color: inherit; text-decoration: none; }
  button { border: 0; background: none; cursor: pointer; }
  img { display: block; }

  /* 390px mobile column, centered on wider screens */
  .app {
    width: 100%; max-width: 390px; min-height: 100vh; min-height: 100dvh;
    margin: 0 auto;
    background: var(--surface-page);
    display: flex; flex-direction: column;
    padding: var(--space-64) var(--space-16) 0;
  }
  .main { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); }

  /* Header */
  .header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
  .date { font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); }
  .title { font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.8px; word-break: keep-all; }
  .title em { font-style: normal; color: var(--color-primary); }

  /* Filter chips */
  .filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); }
  .chip {
    height: 36px; padding: 0 var(--space-16); border-radius: var(--radius-full);
    background: var(--surface-card); color: var(--text-secondary);
    font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--color-primary); color: var(--text-on-primary); }

  /* Cards */
  .card { background: var(--surface-card); border-radius: var(--radius-xl); padding: var(--space-8) 0; }
  .card-header {
    height: 40px; display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header h2 { flex: 1; min-width: 1px; font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; }
  .card-header .action {
    display: flex; align-items: center; gap: var(--space-4);
    font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); white-space: nowrap;
  }

  /* Memo item */
  .item {
    height: 72px; display: flex; align-items: center; gap: var(--space-16);
    padding: var(--space-12) var(--space-20);
  }
  .item:active { background: rgba(0,0,0,.03); }
  .tile { width: 44px; height: 44px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
  .tile.blue { background: var(--label-blue-soft); }
  .tile.green { background: var(--label-green-soft); }
  .tile.orange { background: var(--label-orange-soft); }
  .tile.pink { background: var(--label-pink-soft); }
  .content { flex: 1; min-width: 1px; display: flex; flex-direction: column; gap: var(--space-4); }
  .item-title { font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; }
  .preview {
    font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: -0.1px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-date { flex: none; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }

  /* Primary button — pinned to bottom */
  .footer {
    position: sticky; bottom: 0; z-index: 1;
    padding: var(--space-16) 0 var(--space-34);
    background: var(--surface-page);
  }
  .btn-primary {
    width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; gap: var(--space-8);
    padding: 0 var(--space-24); border-radius: var(--radius-md);
    background: var(--color-primary); color: var(--text-on-primary);
    font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap;
  }
  .btn-primary:active { filter: brightness(.95); }
</style>
</head>
